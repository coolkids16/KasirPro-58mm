[package]
name = "kasirpro-pos"
version = "0.1.0"
description = "Aplikasi Kasir POS 58mm untuk Linux Desktop (CachyOS) dan Android"
authors = ["KasirPro"]
edition = "2021"

[lib]
name = "kasirpro_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
